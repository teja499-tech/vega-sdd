[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vega-sdd"
version = "0.4.1"
description = "Repository-owned project lifecycle framework for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Teja Nalluri"}]
maintainers = [{name = "Teja Nalluri"}]
keywords = ["coding-agents", "spec-driven-development", "software-delivery", "project-lifecycle"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<16",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
sdd = "universal_sdd.cli:app"

[project.urls]
Homepage = "https://github.com/teja499-tech/vega-sdd"
Repository = "https://github.com/teja499-tech/vega-sdd"
Issues = "https://github.com/teja499-tech/vega-sdd/issues"
Changelog = "https://github.com/teja499-tech/vega-sdd/blob/main/CHANGELOG.md"
Documentation = "https://github.com/teja499-tech/vega-sdd/tree/main/docs"
Security = "https://github.com/teja499-tech/vega-sdd/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
universal_sdd = ["skill_texts/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["universal_sdd"]
