name: Framework checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest tests
      - run: python examples/incident-service/run_benchmark.py "$RUNNER_TEMP/incident"
      - run: python examples/incident-service/verify_documentation.py "$RUNNER_TEMP/incident" "$RUNNER_TEMP/brownfield"
      - run: python examples/cross-projects/run_benchmarks.py "$RUNNER_TEMP/cross"
      - run: python -m build --no-isolation
