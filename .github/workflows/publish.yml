name: Publish to PyPI
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify release source and version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["TAG_VERSION"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with v: {tag}")
          package_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag[1:] != package_version:
              raise SystemExit(f"tag {tag} does not match package version {package_version}")
          PY
      - run: python -m pip install '.[dev]' build 'setuptools>=77'
      - run: python -m pytest tests
      - run: python examples/incident-service/run_benchmark.py "$RUNNER_TEMP/incident"
      - run: python examples/incident-service/verify_documentation.py "$RUNNER_TEMP/incident" "$RUNNER_TEMP/brownfield"
      - run: python examples/cross-projects/run_benchmarks.py "$RUNNER_TEMP/cross"
      - run: python -m build --no-isolation
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
