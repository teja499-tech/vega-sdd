name: Publish to PyPI
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest tests
      - run: python examples/incident-service/run_benchmark.py "$RUNNER_TEMP/incident"
      - run: python examples/incident-service/verify_documentation.py "$RUNNER_TEMP/incident" "$RUNNER_TEMP/brownfield"
      - run: python examples/cross-projects/run_benchmarks.py "$RUNNER_TEMP/cross"
      - run: python -m build --no-isolation
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
